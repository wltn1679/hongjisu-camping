<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구역 상세 - 홍지수캠핑장</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <div class="brand">
      <a class="logo" href="index.html">🌲 홍지수캠핑장</a>
      <a class="maplink" href="map.html">📍 사이트 위치보기</a>
    </div>
    <nav>
      <a href="index.html">구역 보기</a>
      <a href="my.html">내 예약</a>
    </nav>
  </header>

  <main id="content"></main>

  <footer>© 홍지수캠핑장 · 과제용 데모 사이트</footer>

  <script src="data.js"></script>
  <script src="app.js"></script>
  <script>
    // 주소의 ?id=3&in=...&out=... 부분 읽기
    const params = new URLSearchParams(location.search);
    const site = findSite(Number(params.get("id")));
    const content = document.getElementById("content");
    initBookings().then(showDemoBanner); // 서버에서 예약 현황 받기 (서버가 없으면 데모 모드 안내 표시)

    if (!site) {
      content.innerHTML = '<p class="empty">없는 구역이에요. <a href="index.html">목록으로</a></p>';
    } else {
      content.innerHTML =
        '<div class="box">' +
          '<div class="card">' + sitePicHtml(site, true) + '</div>' +
          '<span class="tag zone-' + site.zone + '" style="margin-top:12px">' + site.zone + ' ZONE · ' + site.type + '</span>' +
          '<h2 style="margin-top:0">' + site.name + '</h2>' +
          '<p>' + site.desc + '</p>' +
          '<p class="price">1박 ' + formatPrice(site.price) + ' · 최대 ' + site.capacity + '명</p>' +
          '<p><a href="map.html?id=' + site.id + '">📍 지도에서 위치 보기</a> · <a href="tour.html?scene=s' + site.id + '">🚶 로드뷰로 보기</a></p>' +
          zoneNoticeHtml(site) +
        '</div>' +
        '<div class="box">' +
          '<h2 style="margin-top:0">예약하기</h2>' +
          '<div class="form-row"><label>입실일</label><input type="date" id="checkIn"></div>' +
          '<div class="form-row"><label>퇴실일</label><input type="date" id="checkOut"></div>' +
          '<div class="form-row"><label>인원 (최대 ' + site.capacity + '명)</label><input type="number" id="people" min="1" max="' + site.capacity + '" value="2"></div>' +
          '<div class="form-row"><label>예약자 이름</label><input type="text" id="name" placeholder="홍길동"></div>' +
          '<div class="form-row"><label>연락처</label><input type="tel" id="phone" placeholder="010-1234-5678"></div>' +
          '<div class="form-row"><label><input type="checkbox" id="agree" style="width:auto"> ' + site.zone + ' 존 안내(' + (site.zone === "E" ? "매너타임 없음" : "매너타임 필수") + ')를 확인했어요</label></div>' +
          '<div class="total" id="total">날짜를 선택하면 금액이 나와요</div>' +
          '<div class="error" id="err"></div>' +
          '<button id="reserveBtn">예약 확정</button>' +
        '</div>';

      const inEl = document.getElementById("checkIn");
      const outEl = document.getElementById("checkOut");
      const peopleEl = document.getElementById("people");
      const totalEl = document.getElementById("total");
      const errEl = document.getElementById("err");

      inEl.min = todayString();
      outEl.min = todayString();

      // 목록 페이지에서 넘어온 값이 있으면 채워 넣기
      if (params.get("in")) inEl.value = params.get("in");
      if (params.get("out")) outEl.value = params.get("out");
      if (params.get("people")) peopleEl.value = Math.min(Number(params.get("people")), site.capacity);

      // 총 금액 계산해서 보여주기
      function updateTotal() {
        if (inEl.value && outEl.value) {
          const n = countNights(inEl.value, outEl.value);
          if (n >= 1) {
            totalEl.textContent = n + "박 총 " + formatPrice(n * site.price);
            return;
          }
        }
        totalEl.textContent = "날짜를 선택하면 금액이 나와요";
      }
      inEl.addEventListener("change", updateTotal);
      outEl.addEventListener("change", updateTotal);
      updateTotal();

      // 예약 버튼
      document.getElementById("reserveBtn").addEventListener("click", async function () {
        errEl.textContent = "";
        const checkIn = inEl.value;
        const checkOut = outEl.value;
        const people = Number(peopleEl.value);
        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();

        // 1) 입력값 검사
        if (!checkIn || !checkOut) { errEl.textContent = "날짜를 선택해 주세요."; return; }
        const nights = countNights(checkIn, checkOut);
        if (nights < 1) { errEl.textContent = "퇴실일은 입실일보다 뒤여야 해요."; return; }
        if (!people || people < 1 || people > site.capacity) {
          errEl.textContent = "인원은 1~" + site.capacity + "명까지 가능해요."; return;
        }
        if (!name || !phone) { errEl.textContent = "이름과 연락처를 입력해 주세요."; return; }
        if (!document.getElementById("agree").checked) { errEl.textContent = "존 안내 확인에 체크해 주세요."; return; }

        // 2) ★ 날짜 겹침 검사 (최신 예약 현황을 서버에서 다시 받아서 확인)
        const btn = document.getElementById("reserveBtn");
        btn.disabled = true;
        btn.textContent = "예약하는 중…";
        await initBookings();
        if (!isAvailable(site.id, checkIn, checkOut)) {
          errEl.textContent = "그 날짜에는 이미 예약이 있어요. 다른 날짜를 선택해 주세요.";
          btn.disabled = false; btn.textContent = "예약 확정";
          return;
        }

        // 3) 저장 (서버가 연결돼 있으면 서버 DB에, 아니면 이 브라우저에)
        // 서버가 한 번 더 중복을 검사하고 금액도 직접 계산해요.
        const result = await createReservation({
          siteId: site.id, checkIn: checkIn, checkOut: checkOut,
          people: people, name: name, phone: phone
        });
        if (!result.ok) {
          errEl.textContent = result.error;
          btn.disabled = false; btn.textContent = "예약 확정";
          return;
        }
        location.href = "my.html?new=" + encodeURIComponent(result.reservation.code);
      });
    }
  </script>
</body>
</html>
